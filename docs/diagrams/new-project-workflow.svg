<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2240" viewBox="0 0 1400 2240" role="img" aria-label="新项目 从目标到规格 票据 实施与交付"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#587386"/></marker></defs><rect width="1400" height="2240" fill="#f5f8fb"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172d40}.t{font-size:30px;font-weight:700}.s{font-size:19px;fill:#52687b}.n{font-size:20px}.e{font-size:17px;fill:#52687b}</style>
<text x="50" y="56" class="t">新项目 从目标到规格 票据 实施与交付</text>
<text x="50" y="92" class="s">九项主流程职责 + 三个可选方法；不是十二个必经阶段，也不承诺宿主自动调度。</text>
<rect x="370" y="140" width="660" height="90" rx="14" fill="#e1edf5" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="177.0" text-anchor="middle" class="n">明确目标、范围与授权</text>
<text x="700.0" y="207.0" text-anchor="middle" class="n">新项目通常从 ff-grill 开始</text>
<rect x="370" y="290" width="660" height="100" rx="14" fill="#e1edf5" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="332.0" text-anchor="middle" class="n">ff-grill 澄清用户与成功条件</text>
<text x="700.0" y="362.0" text-anchor="middle" class="n">已有明确确认可复用，不重复盘问</text>
<rect x="370" y="470" width="660" height="110" rx="14" fill="#e1edf5" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="517.0" text-anchor="middle" class="n">ff-spec 确认基线与稳定需求 ID</text>
<text x="700.0" y="547.0" text-anchor="middle" class="n">openspec/specs + changes；验收可追踪</text>
<rect x="40" y="650" width="390" height="110" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="235.0" y="682.0" text-anchor="middle" class="n">ff-design 可选</text>
<text x="235.0" y="712.0" text-anchor="middle" class="n">视觉/交互方向需要选择</text>
<text x="235.0" y="742.0" text-anchor="middle" class="n">候选 → 选择 → 回写规格</text>
<rect x="970" y="650" width="390" height="110" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="1165.0" y="682.0" text-anchor="middle" class="n">ff-prove 可选</text>
<text x="1165.0" y="712.0" text-anchor="middle" class="n">技术/真实环境存在关键未知</text>
<text x="1165.0" y="742.0" text-anchor="middle" class="n">有界实验 → 证据 → 回写规格</text>
<rect x="470" y="650" width="460" height="110" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="682.0" text-anchor="middle" class="n">规格与关键未知已就绪？</text>
<text x="700.0" y="712.0" text-anchor="middle" class="n">缺项回到对应责任补齐</text>
<text x="700.0" y="742.0" text-anchor="middle" class="n">无相关未知可跳过两侧环节</text>
<rect x="370" y="850" width="660" height="110" rx="14" fill="#e1edf5" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="897.0" text-anchor="middle" class="n">ff-plan 把确认变更拆成可执行票据</text>
<text x="700.0" y="927.0" text-anchor="middle" class="n">artifact ID → 依赖指纹 → 验收与证据</text>
<rect x="370" y="1030" width="660" height="110" rx="14" fill="#ffffff" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="1062.0" text-anchor="middle" class="n">前置风险检查 / ff-review · plan</text>
<text x="700.0" y="1092.0" text-anchor="middle" class="n">普通任务自检；关键风险独立审方案</text>
<text x="700.0" y="1122.0" text-anchor="middle" class="n">用户要求和既有门禁仍须满足</text>
<rect x="370" y="1210" width="660" height="110" rx="14" fill="#e1edf5" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="1242.0" text-anchor="middle" class="n">ff-implement 实施已获准切片</text>
<text x="700.0" y="1272.0" text-anchor="middle" class="n">status / apply 判定 + 授权 → 实现 → 测试</text>
<text x="700.0" y="1302.0" text-anchor="middle" class="n">每片保存当前版本的证据和检查点</text>
<rect x="370" y="1390" width="660" height="110" rx="14" fill="#ffffff" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="1422.0" text-anchor="middle" class="n">阶段末一次综合独立 ff-review</text>
<text x="700.0" y="1452.0" text-anchor="middle" class="n">一名读者分别判断目标、计划与代码</text>
<text x="700.0" y="1482.0" text-anchor="middle" class="n">修复局部复核；新关键缺陷仍阻断</text>
<rect x="370" y="1570" width="660" height="110" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="1602.0" text-anchor="middle" class="n">验证与人工接受分别记录</text>
<text x="700.0" y="1632.0" text-anchor="middle" class="n">verified ≠ accepted ≠ archived</text>
<text x="700.0" y="1662.0" text-anchor="middle" class="n">依赖或审核过期：FF gate 阻塞 archive</text>
<rect x="370" y="1750" width="660" height="110" rx="14" fill="#e2efe8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="700.0" y="1782.0" text-anchor="middle" class="n">ff-deliver 交付并记录规格状态</text>
<text x="700.0" y="1812.0" text-anchor="middle" class="n">archive 正常路径同步 specs；取消不伪造 pass</text>
<text x="700.0" y="1842.0" text-anchor="middle" class="n">PR 可选；不自动合并主分支或发布</text>
<rect x="40" y="1210" width="290" height="120" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="185.0" y="1247.0" text-anchor="middle" class="n">ff-diagnose · 故障支线</text>
<text x="185.0" y="1277.0" text-anchor="middle" class="n">先复现、证据与定位</text>
<text x="185.0" y="1307.0" text-anchor="middle" class="n">修复回 Implement</text>
<rect x="1070" y="1210" width="290" height="120" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="1215.0" y="1247.0" text-anchor="middle" class="n">ff-tdd · 实施内部</text>
<text x="1215.0" y="1277.0" text-anchor="middle" class="n">一次一个业务行为</text>
<text x="1215.0" y="1307.0" text-anchor="middle" class="n">red → green；局部自检</text>
<rect x="40" y="1930" width="550" height="110" rx="14" fill="#fff0d8" stroke="#a9bac8" stroke-width="1.5"/>
<text x="315.0" y="1962.0" text-anchor="middle" class="n">ff-handoff · 任意阶段暂停/换会话</text>
<text x="315.0" y="1992.0" text-anchor="middle" class="n">出站：规格版本、变更状态、证据、下一步</text>
<text x="315.0" y="2022.0" text-anchor="middle" class="n">不代表本轮已经最终交付</text>
<rect x="810" y="1930" width="550" height="110" rx="14" fill="#ffffff" stroke="#a9bac8" stroke-width="1.5"/>
<text x="1085.0" y="1962.0" text-anchor="middle" class="n">接收方 ff-intake → 只读核验</text>
<text x="1085.0" y="1992.0" text-anchor="middle" class="n">核对目标/依赖与完成回执绑定</text>
<text x="1085.0" y="2022.0" text-anchor="middle" class="n">完成跳过；运行中先观察；重核权限</text>
<polyline points="700,230 700,290" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="700,390 700,470" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="700,580 700,650" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="370,525 235,525 235,650" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="80" y="510" class="e">视觉未知</text>
<polyline points="1030,525 1165,525 1165,650" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="1100" y="510" class="e">技术未知</text>
<polyline points="40,705 20,705 20,440 500,440 500,470" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="65" y="425" class="e">反馈更新规格</text>
<polyline points="1360,705 1380,705 1380,440 900,440 900,470" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="1080" y="425" class="e">反馈更新规格</text>
<polyline points="700,760 700,850" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="710" y="805" class="e">就绪</text>
<polyline points="700,960 700,1030" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="700,1140 700,1210" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="710" y="1180" class="e">适用前置满足且已获准</text>
<polyline points="700,1320 700,1390" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="700,1500 700,1570" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="700,1680 700,1750" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="710" y="1720" class="e">满足当前交付门槛</text>
<polyline points="370,1240 330,1240" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="330,1300 370,1300" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1030,1240 1070,1240" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1070,1300 1030,1300" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<polyline points="370,1265 350,1265 350,1885 315,1885 315,1930" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="50" y="1898" class="e">暂停时（非必经）</text>
<polyline points="590,1985 810,1985" fill="none" stroke="#587386" stroke-width="2" marker-end="url(#a)"/>
<text x="620" y="1970" class="e">接手前核验</text>
<text x="50" y="2145" class="s">Diagnose 定位 → Implement 修复 → Review；TDD 逐条 red → green；大重构回 Plan/Review。</text>
<text x="50" y="2175" class="s">轻量小修可内联规格与票据；不取消验收、授权、验证和与风险相称的独立审核。</text>
<text x="50" y="2205" class="s">Handoff 可在任何阶段发生；Deliver 是成果交付，不自动合并、部署或发布。</text>
</svg>