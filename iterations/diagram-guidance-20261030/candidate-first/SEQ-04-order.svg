H306.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="188.0" y="112" font-size="12" text-anchor="middle">confirmOrder(request)</text><path d="M306.0,165 H542.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="424.0" y="157" font-size="12" text-anchor="middle">authorize(payment)</text><rect x="15" y="190" width="1290" height="650" fill="none" stroke="#56677c"/><text x="22" y="208" font-size="12" text-anchor="start">alt 授权结果</text><text x="25" y="228" font-size="13" text-anchor="start">[授权明确成功]</text><path d="M542.0,265 H306.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="424.0" y="257" font-size="12" text-anchor="middle">authorized(authorizationRef)</text><path d="M306.0,315 H778.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="542.0" y="307" font-size="12" text-anchor="middle">本地事务：写订单 + outbox；提交</text><rect x="20" y="340" width="1280" height="285" fill="none" stroke="#56677c"/><text x="22" y="358" font-size="12" text-anchor="start">alt 本地提交结果</text><text x="30" y="377" font-size="13" text-anchor="start">[提交成功]</text><path d="M778.0,412 H306.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="542.0" y="404" font-size="12" text-anchor="middle">committed</text><path d="M306.0,457 H70.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="188.0" y="449" font-size="12" text-anchor="middle">订单已确认</text><path d="M20,480 H1300" stroke="#56677c" stroke-dasharray="5 4"/><text x="22" y="498" font-size="12" text-anchor="start">[提交失败]</text><path d="M778.0,527 H306.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="542.0" y="519" font-size="12" text-anchor="middle">commitFailed</text><path d="M306.0,573 H70.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="188.0" y="565" font-size="12" text-anchor="middle">订单未确认；支付需核对/补偿</text><text x="28" y="610" font-size="13" text-anchor="start">进入核对/补偿处理（机制待定）；不得生成/发送 OrderConfirmed，补偿可能失败。</text><path d="M15,640 H1305" stroke="#56677c" stroke-dasharray="5 4"/><text x="22" y="658" font-size="12" text-anchor="start">[授权明确失败]</text><path d="M542.0,687 H306.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="424.0" y="679" font-size="12" text-anchor="middle">declined</text><path d="M306.0,732 H70.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="188.0" y="724" font-size="12" text-anchor="middle">授权失败；不写确认订单/outbox</text><path d="M15,750 H1305" stroke="#56677c" stroke-dasharray="5 4"/><text x="22" y="768" font-size="12" text-anchor="start">[授权超时，结果未知]</text><path d="M306.0,807 H70.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="188.0" y="799" font-size="12" text-anchor="middle">结果未知；进入支付核对，不假定未扣款</text><rect x="15" y="870" width="1290" height="285" fill="none" stroke="#56677c"/><text x="22" y="888" font-size="12" text-anchor="start">独立提交后交互 [存在已提交 outbox]；不要求先于/晚于客户端接收回复</text><path d="M1014.0,925 H778.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="896.0" y="917" font-size="12" text-anchor="middle">读取已提交 outbox</text><path d="M778.0,970 H1014.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="896.0" y="962" font-size="12" text-anchor="middle">OrderConfirmed(eventId, orderId)</text><path d="M1014.0,1020 H1250.0" stroke="#27364b" fill="none" marker-end="url(#open)"/><text x="1132.0" y="1012" font-size="12" text-anchor="middle">OrderConfirmed（异步，可能重复）</text><text x="28" y="1070" font-size="13" text-anchor="start">邮件消费者：以稳定事件/业务标识幂等处理；重复消息不重复发信。</text><text x="28" y="1115" font-size="13" text-anchor="start">邮件失败 → 保留重试工作/失败状态；订单仍已确认。重试耗尽的人工处置机制待定。</text><text x="28" y="1200" font-size="13" text-anchor="start">超时分支没有伪造支付失败回复；核对、补偿与邮件重试不被假定永远成功。</text></g></svg>