<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="805" viewBox="0 0 1250 805"><defs><marker id="sync" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27364b"/></marker><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#27364b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172336" font-size="13"><text x="20" y="24" font-size="16" text-anchor="start">创建请求运行视图｜仓储实现经接口绑定（该调用分配为交接候选）</text><rect x="9.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M70.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="70.0" y="69" font-size="12" text-anchor="middle">前端</text><rect x="231.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M292.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="292.0" y="69" font-size="12" text-anchor="middle">Booking API</text><rect x="453.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M514.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="514.0" y="69" font-size="12" text-anchor="middle">BookingService</text><rect x="675.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M736.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="736.0" y="69" font-size="12" text-anchor="middle">仓储实现</text><rect x="897.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M958.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="958.0" y="69" font-size="12" text-anchor="middle">数据库</text><rect x="1119.0" y="44" width="122" height="40" rx="2" fill="#eef3f8" stroke="#27364b"/><path d="M1180.0,84 V760" stroke="#8793a3" stroke-dasharray="5 5"/><text x="1180.0" y="69" font-size="12" text-anchor="middle">Publisher</text><path d="M70.0,125 H292.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="181.0" y="117" font-size="12" text-anchor="middle">createBooking(userId, roomId, slot, requestId)</text><path d="M292.0,175 H514.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="403.0" y="167" font-size="12" text-anchor="middle">createBooking(...)</text><text x="28" y="210" font-size="13" text-anchor="start">Service 校验权限与时段；不合法则拒绝，沿同步调用返回，不进入事务。</text><rect x="15" y="230" width="1220" height="210" fill="none" stroke="#56677c"/><text x="22" y="248" font-size="12" text-anchor="start">事务边界（创建路径候选实现；提交前不发送外部通知）</text><path d="M514.0,280 H736.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="625.0" y="272" font-size="12" text-anchor="middle">创建预订（接口操作名待定）</text><path d="M736.0,325 H958.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="847.0" y="317" font-size="12" text-anchor="middle">BEGIN；检查冲突；写预订 + outbox；COMMIT</text><path d="M958.0,375 H736.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="847.0" y="367" font-size="12" text-anchor="middle">提交成功 / 冲突或数据库失败</text><path d="M736.0,420 H514.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="625.0" y="412" font-size="12" text-anchor="middle">预订结果 / 失败</text><path d="M514.0,475 H292.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="403.0" y="467" font-size="12" text-anchor="middle">bookingId / 拒绝原因</text><path d="M292.0,520 H70.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="181.0" y="512" font-size="12" text-anchor="middle">成功仅在提交后返回；否则失败</text><rect x="15" y="550" width="1220" height="175" fill="none" stroke="#56677c"/><text x="22" y="568" font-size="12" text-anchor="start">独立后台路径：仅消费已提交 outbox；与响应先后无额外全局顺序保证</text><path d="M1180.0,600 H958.0" stroke="#27364b" fill="none" marker-end="url(#sync)"/><text x="1069.0" y="592" font-size="12" text-anchor="middle">读取已提交待投递 outbox</text><path d="M958.0,645 H1180.0" stroke="#27364b" fill="none" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1069.0" y="637" font-size="12" text-anchor="middle">通知事件</text><text x="28" y="690" font-size="13" text-anchor="start">Publisher → 通知接收方：异步投递（接收方未指定）；失败不回滚预订。</text><text x="28" y="765" font-size="13" text-anchor="start">图例：实线实心箭头=同步调用；虚线空心箭头=回复。后台投递职责与静态模块依赖分开。</text></g></svg>